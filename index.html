<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colony Builder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #d0d8e8; font-family: 'Inter', 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
    #app { display: flex; height: 100vh; }

    #sidebar {
      width: 230px; min-width: 230px;
      background: linear-gradient(180deg, #111827 0%, #0d1520 100%);
      border-right: 1px solid #1e3a5a;
      display: flex; flex-direction: column;
      overflow-y: auto;
      box-shadow: 2px 0 12px rgba(0,0,0,0.5);
    }

    #sidebar-title {
      padding: 14px 16px 10px;
      font-family: 'Cinzel', serif;
      font-size: 15px; font-weight: 600;
      color: #c8a84a;
      letter-spacing: 1px;
      border-bottom: 1px solid #1e3a5a;
      background: linear-gradient(90deg, #1a2a40, #111827);
      text-shadow: 0 0 12px rgba(200,168,74,0.4);
    }

    #sidebar h2 {
      font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
      color: #4a6888; padding: 8px 14px 5px;
      border-bottom: 1px solid #1a2e44;
    }

    #resources { padding: 8px 14px 4px; }
    .resource {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; font-size: 13px; color: #b0c8e0;
      border-bottom: 1px solid #141e2c;
    }
    .resource:last-child { border-bottom: none; }
    .resource .icon { font-size: 15px; width: 20px; text-align: center; }
    .resource .val { font-weight: 500; color: #e8d898; min-width: 32px; text-align: right; }

    #season-info {
      padding: 10px 14px 8px;
      border-top: 1px solid #1a2e44;
      background: rgba(255,255,255,0.02);
    }
    #season-label { font-weight: 600; font-size: 14px; color: #7ec8e3; }
    #day-label { font-size: 11px; color: #4a6888; margin-top: 2px; }
    #raid-alert { font-size: 11px; color: #cc4444; margin-top: 4px; font-weight: 600; display: none; }
    #raid-alert.active { display: block; animation: pulse 0.8s infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }

    #build-panel { border-top: 1px solid #1a2e44; }
    #build-panel h2 { margin-bottom: 0; }

    .build-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 9px 14px;
      background: transparent; color: #a0b8d0;
      border: none; border-bottom: 1px solid #141e2c;
      text-align: left; font-size: 13px; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
    }
    .build-btn:hover { background: rgba(255,255,255,0.05); color: #d0e8f8; }
    .build-btn.active {
      background: linear-gradient(90deg, rgba(32,160,144,0.15), transparent);
      color: #60d0b8;
      border-left: 2px solid #20a090;
      padding-left: 12px;
    }
    .build-btn .btn-icon { font-size: 16px; width: 20px; text-align: center; }
    .build-btn .cost { font-size: 10px; color: #4a6888; margin-left: auto; }
    .cancel-btn { color: #884848; }
    .cancel-btn:hover { color: #e07070; background: rgba(200,50,50,0.08); }

    #info-panel { border-top: 1px solid #1a2e44; flex: 0 0 auto; }
    #info-content { padding: 8px 14px; font-size: 12px; color: #5a7890; line-height: 1.7; }

    #log-panel { border-top: 1px solid #1a2e44; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #log-content { padding: 6px 14px; font-size: 11px; color: #3a5068; overflow-y: auto; flex: 1; line-height: 1.8; }
    #log-content div { border-bottom: 1px solid #0e1820; padding: 2px 0; }
    #log-content div:first-child { color: #7a9ab8; }

    #game-area { flex: 1; position: relative; overflow: hidden; cursor: default; }
    #game-area.placing { cursor: crosshair; }

    .float-label {
      position: absolute;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-title">&#9956; Colony Builder</div>

      <div id="resources">
        <h2>Resources</h2>
        <div class="resource"><span class="icon">🪵</span>Wood<span class="val" id="res-wood">20</span></div>
        <div class="resource"><span class="icon">🪨</span>Stone<span class="val" id="res-stone">10</span></div>
        <div class="resource"><span class="icon">🌾</span>Food<span class="val" id="res-food">15</span></div>
        <div class="resource"><span class="icon">👥</span>People<span class="val"><span id="res-pop">0</span>/<span id="res-housing">0</span></span></div>
      </div>

      <div id="season-info">
        <div id="season-label">Spring</div>
        <div id="day-label">Day 1</div>
        <div id="raid-alert">&#9876; Raiders!</div>
      </div>

      <div id="build-panel">
        <h2>Construct</h2>
        <button class="build-btn" data-type="house"><span class="btn-icon">🏠</span>House<span class="cost">5🪵 3🪨</span></button>
        <button class="build-btn" data-type="farm"><span class="btn-icon">🌾</span>Farm<span class="cost">4🪵</span></button>
        <button class="build-btn" data-type="woodcutter"><span class="btn-icon">🪓</span>Woodcutter<span class="cost">3🪵</span></button>
        <button class="build-btn" data-type="quarry"><span class="btn-icon">⛏</span>Quarry<span class="cost">5🪵</span></button>
        <button class="build-btn" data-type="storehouse"><span class="btn-icon">📦</span>Storehouse<span class="cost">6🪵 4🪨</span></button>
        <button class="build-btn" data-type="wall"><span class="btn-icon">🧱</span>Wall<span class="cost">2🪨</span></button>
        <button class="build-btn" data-type="tower"><span class="btn-icon">🗼</span>Tower<span class="cost">4🪵 8🪨</span></button>
        <button class="build-btn" data-type="barracks"><span class="btn-icon">⚔</span>Barracks<span class="cost">6🪵 4🪨</span></button>
        <button class="build-btn cancel-btn" data-type="none"><span class="btn-icon">✖</span>Cancel</button>
      </div>

      <div id="save-panel">
        <h2>Colony</h2>
        <div style="display:flex;gap:6px;padding:8px 14px;">
          <button class="build-btn" id="btn-save" data-type="" style="flex:1;justify-content:center;font-size:12px;padding:6px 4px;">💾 Save (S)</button>
          <button class="build-btn" id="btn-load" data-type="" style="flex:1;justify-content:center;font-size:12px;padding:6px 4px;">📂 Load (L)</button>
        </div>
      </div>

      <div id="info-panel">
        <h2>Selected</h2>
        <div id="info-content">Click a tile to inspect</div>
      </div>

      <div id="log-panel">
        <h2>Log</h2>
        <div id="log-content"></div>
      </div>
    </div>

    <div id="game-area">
      <!-- Three.js renders into its own canvas appended here -->
      <canvas id="minimap-canvas" width="160" height="120"
        style="position:absolute;bottom:10px;right:10px;z-index:10;border:2px solid #2a4a6a;cursor:pointer"></canvas>
      <div id="float-container"
        style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    </div>
  </div>

  <!-- Win / Game-over overlay -->
  <div id="game-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;align-items:center;justify-content:center;">
    <div style="background:#0d1117;border:2px solid #2a5a8a;border-radius:8px;padding:44px 48px;text-align:center;max-width:340px;font-family:'Inter',sans-serif;">
      <div id="overlay-title" style="font-family:'Cinzel',serif;font-size:26px;color:#c8a84a;margin-bottom:14px;"></div>
      <div id="overlay-body" style="font-size:14px;color:#a0b8d0;line-height:1.9;margin-bottom:28px;"></div>
      <button id="overlay-btn" style="padding:10px 32px;background:#1e3a5a;color:#d0e8f8;border:1px solid #2a6a9a;font-size:14px;border-radius:4px;cursor:pointer;font-family:inherit;letter-spacing:0.04em;"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="game.js" onerror="document.body.innerHTML='<p style=color:red;padding:20px>Could not load game.js — make sure all 3 files are in the same folder</p>'"></script>
</body>
</html>
