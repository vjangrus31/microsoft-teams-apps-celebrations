<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colony Builder</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
#app { display: flex; height: 100vh; }
#sidebar { width: 220px; min-width: 220px; background: #16213e; border-right: 2px solid #0f3460; display: flex; flex-direction: column; overflow-y: auto; }
#sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #a0b0c0; padding: 8px 12px 4px; border-bottom: 1px solid #0f3460; background: #0f3460; }
#resources { padding: 8px 12px; }
.resource { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 14px; }
.resource .icon { font-size: 16px; }
#season-info { padding: 8px 12px; border-top: 1px solid #0f3460; font-size: 13px; color: #7ec8e3; }
#season-label { font-weight: bold; font-size: 15px; }
#day-label { color: #a0b0c0; font-size: 12px; }
#build-panel { border-top: 2px solid #0f3460; }
#build-panel h2 { margin-bottom: 0; }
.build-btn { display: block; width: 100%; padding: 8px 12px; background: #1a3a5c; color: #e0e0e0; border: none; border-bottom: 1px solid #0f3460; text-align: left; font-size: 13px; cursor: pointer; transition: background 0.15s; }
.build-btn:hover { background: #2a5080; }
.build-btn.active { background: #0f6460; border-left: 3px solid #20a090; }
.cancel-btn { color: #e07070; }
#info-panel { border-top: 2px solid #0f3460; flex: 0 0 auto; }
#info-content { padding: 8px 12px; font-size: 12px; color: #a0b0c0; line-height: 1.6; }
#log-panel { border-top: 2px solid #0f3460; flex: 1; min-height: 0; display: flex; flex-direction: column; }
#log-content { padding: 6px 12px; font-size: 11px; color: #708090; overflow-y: auto; flex: 1; line-height: 1.7; }
#log-content div { border-bottom: 1px solid #0f1e30; padding: 1px 0; }
#game-area { flex: 1; position: relative; overflow: hidden; }
#canvas { display: block; cursor: default; }
#canvas.placing { cursor: crosshair; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="resources">
        <h2>Resources</h2>
        <div class="resource"><span class="icon">🪵</span><span id="res-wood">0</span> Wood</div>
        <div class="resource"><span class="icon">🪨</span><span id="res-stone">0</span> Stone</div>
        <div class="resource"><span class="icon">🌾</span><span id="res-food">0</span> Food</div>
        <div class="resource"><span class="icon">👥</span><span id="res-pop">0</span> / <span id="res-housing">0</span> Pop</div>
      </div>

      <div id="season-info">
        <div id="season-label">Spring</div>
        <div id="day-label">Day 1</div>
      </div>

      <div id="build-panel">
        <h2>Build</h2>
        <button class="build-btn" data-type="house" title="5 Wood, 3 Stone">🏠 House</button>
        <button class="build-btn" data-type="farm" title="4 Wood">🌾 Farm</button>
        <button class="build-btn" data-type="woodcutter" title="3 Wood">🪓 Woodcutter</button>
        <button class="build-btn" data-type="quarry" title="5 Wood">⛏ Quarry</button>
        <button class="build-btn" data-type="storehouse" title="6 Wood, 4 Stone">📦 Storehouse</button>
        <button class="build-btn cancel-btn" data-type="none">✖ Cancel</button>
      </div>

      <div id="info-panel">
        <h2>Selected</h2>
        <div id="info-content">Click a tile to inspect</div>
      </div>

      <div id="log-panel">
        <h2>Log</h2>
        <div id="log-content"></div>
      </div>
    </div>

    <div id="game-area">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script src="game.js" onerror="document.body.innerHTML='<p style=color:red;padding:20px>Could not load game.js — make sure all 3 files are in the same folder</p>'"></script>
</body>
</html>
