<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colony Builder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080d14; color: #c8d8e8; font-family: 'Inter', 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
    #app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px; min-width: 240px;
      background: #0a0f18;
      border-right: 1px solid #1a2d45;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #sidebar-title {
      padding: 13px 16px 11px;
      font-family: 'Cinzel', serif;
      font-size: 14px; font-weight: 600;
      color: #c8a84a; letter-spacing: 1.5px;
      border-bottom: 1px solid #1a2d45;
      background: linear-gradient(90deg,#0f1e32,#0a0f18);
      text-shadow: 0 0 16px rgba(200,168,74,0.5);
      flex-shrink: 0;
    }
    .panel { border-bottom: 1px solid #1a2d45; flex-shrink: 0; }
    .panel h2 {
      font-size: 8px; text-transform: uppercase; letter-spacing: 2.5px;
      color: #2a4a68; padding: 7px 14px 5px; font-weight: 500;
    }

    /* Resources */
    #resources { padding: 6px 14px 8px; }
    .resource {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0; font-size: 12px; color: #90aac0;
      border-bottom: 1px solid #0e1822;
    }
    .resource:last-child { border-bottom: none; }
    .resource .icon { font-size: 14px; width: 18px; text-align: center; opacity: 0.9; }
    .resource .val { font-weight: 500; color: #e0cc88; min-width: 34px; text-align: right; font-size: 13px; }

    /* Season */
    #season-info { padding: 8px 14px 7px; }
    #season-label { font-weight: 500; font-size: 13px; color: #7ec8e3; }
    #day-label { font-size: 10px; color: #3a5470; margin-top: 2px; letter-spacing: 0.5px; }
    #raid-alert { font-size: 10px; color: #dd3333; margin-top: 4px; font-weight: 600; display: none; letter-spacing: 0.5px; }
    #raid-alert.active { display: block; animation: pulse 0.7s infinite alternate; }
    @keyframes pulse { from{opacity:1}to{opacity:0.3} }

    /* Build buttons */
    #build-panel h2 { margin-bottom: 0; }
    .build-btn {
      display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 8px 14px;
      background: transparent; color: #7a9ab8;
      border: none; border-bottom: 1px solid #0e1822;
      text-align: left; font-size: 12px; font-family: inherit;
      cursor: pointer; transition: background 0.12s, color 0.12s;
    }
    .build-btn:hover { background: rgba(255,255,255,0.04); color: #c0d8f0; }
    .build-btn.active {
      background: linear-gradient(90deg,rgba(30,140,120,0.18),transparent);
      color: #50c8a8; border-left: 2px solid #18907a; padding-left: 12px;
    }
    .build-btn .btn-icon { font-size: 14px; width: 18px; text-align: center; }
    .build-btn .cost { font-size: 10px; color: #334858; margin-left: auto; }
    .cancel-btn { color: #7a3a3a; }
    .cancel-btn:hover { color: #d06060; background: rgba(180,40,40,0.07); }

    /* Info panel */
    #info-panel { flex-shrink: 0; }
    #info-content { padding: 7px 14px 8px; font-size: 11px; color: #4a6880; line-height: 1.75; }

    /* Colonist Roster */
    #roster-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    #roster-panel h2 { flex-shrink: 0; }
    #roster-list {
      overflow-y: auto; flex: 1;
      scrollbar-width: thin; scrollbar-color: #1a3050 transparent;
    }
    .colonist-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px 5px 10px; cursor: pointer;
      border-bottom: 1px solid #0e1822;
      transition: background 0.1s;
    }
    .colonist-row:hover { background: rgba(255,255,255,0.04); }
    .colonist-row.selected { background: rgba(30,140,100,0.15); border-left: 2px solid #20a080; padding-left: 8px; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .col-name { font-size: 11px; color: #90b0c8; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .col-job { font-size: 9px; color: #2a4860; white-space: nowrap; }
    .col-hp { width: 36px; flex-shrink: 0; }
    .col-hp-bar { height: 3px; background: #0e1822; border-radius: 2px; overflow: hidden; }
    .col-hp-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

    /* Log */
    #log-panel { border-bottom: none; display: flex; flex-direction: column; flex-shrink: 0; max-height: 130px; }
    #log-content { padding: 4px 14px 6px; font-size: 10px; color: #2e4458; overflow-y: auto; flex: 1; line-height: 1.9; scrollbar-width: thin; scrollbar-color: #1a3050 transparent; }
    #log-content div { border-bottom: 1px solid #0a1218; padding: 1px 0; }
    #log-content div:first-child { color: #6a8aa8; }

    /* Game area */
    #game-area { flex: 1; position: relative; overflow: hidden; cursor: default; }
    #game-area.placing { cursor: crosshair; }
    #game-area canvas { display: block; }
    /* Vignette overlay */
    #game-area::after {
      content:''; pointer-events:none; position:absolute; inset:0;
      background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.45) 100%);
      z-index:5;
    }

    .float-label {
      position: absolute; font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 600; pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      transform: translate(-50%,-50%); white-space: nowrap;
    }

    /* Save row */
    #save-row { display: flex; gap: 6px; padding: 7px 12px; flex-shrink: 0; border-bottom: 1px solid #1a2d45; }
    #save-row button {
      flex: 1; padding: 5px 0; background: rgba(255,255,255,0.03);
      color: #5a7a90; border: 1px solid #1a2d45; border-radius: 3px;
      font-size: 11px; font-family: inherit; cursor: pointer; transition: all 0.12s;
    }
    #save-row button:hover { background: rgba(255,255,255,0.07); color: #90b8d0; }

    .event-btn {
      padding: 9px 14px; background: rgba(255,255,255,0.04);
      color: #a0c0d8; border: 1px solid #1e3a58; border-radius: 4px;
      font-size: 13px; font-family: inherit; cursor: pointer; text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .event-btn:hover { background: rgba(255,255,255,0.09); color: #d0e8f8; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-title">&#9956; Colony Builder</div>

      <div class="panel" id="resources">
        <h2>Resources</h2>
        <div class="resource"><span class="icon">🪵</span>Wood<span class="val" id="res-wood">20</span></div>
        <div class="resource"><span class="icon">🪨</span>Stone<span class="val" id="res-stone">10</span></div>
        <div class="resource"><span class="icon">🌾</span>Food<span class="val" id="res-food">15</span></div>
        <div class="resource"><span class="icon">👥</span>People<span class="val"><span id="res-pop">0</span>/<span id="res-housing">0</span></span></div>
      </div>

      <div class="panel" id="season-info">
        <div id="season-label">Spring</div>
        <div id="day-label">Day 1</div>
        <div id="raid-alert">&#9876; Raiders approaching!</div>
      </div>

      <div class="panel" id="build-panel">
        <h2>Construct</h2>
        <button class="build-btn" data-type="house"><span class="btn-icon">🏠</span>House<span class="cost">5🪵 3🪨</span></button>
        <button class="build-btn" data-type="farm"><span class="btn-icon">🌾</span>Farm<span class="cost">4🪵</span></button>
        <button class="build-btn" data-type="woodcutter"><span class="btn-icon">🪓</span>Woodcutter<span class="cost">3🪵</span></button>
        <button class="build-btn" data-type="quarry"><span class="btn-icon">⛏</span>Quarry<span class="cost">5🪵</span></button>
        <button class="build-btn" data-type="storehouse"><span class="btn-icon">📦</span>Storehouse<span class="cost">6🪵 4🪨</span></button>
        <button class="build-btn" data-type="market"><span class="btn-icon">🏪</span>Market<span class="cost">8🪵 4🪨</span></button>
        <button class="build-btn" data-type="wall"><span class="btn-icon">🧱</span>Wall<span class="cost">2🪨</span></button>
        <button class="build-btn" data-type="tower"><span class="btn-icon">🗼</span>Tower<span class="cost">4🪵 8🪨</span></button>
        <button class="build-btn" data-type="barracks"><span class="btn-icon">⚔</span>Barracks<span class="cost">6🪵 4🪨</span></button>
        <button class="build-btn cancel-btn" data-type="none"><span class="btn-icon">✖</span>Cancel</button>
      </div>

      <div class="panel" id="info-panel">
        <h2>Selected</h2>
        <div id="info-content">Click a tile or colonist</div>
      </div>

      <div id="roster-panel" class="panel">
        <h2>Colonists</h2>
        <div id="roster-list"></div>
      </div>

      <div id="log-panel" class="panel">
        <h2>Log</h2>
        <div id="log-content"></div>
      </div>

      <div id="save-row">
        <button id="btn-save">💾 Save</button>
        <button id="btn-load">📂 Load</button>
        <button id="btn-research">🔬 Research (R)</button>
        <button id="btn-trade">🏪 Trade (T)</button>
      </div>
    </div>

    <div id="game-area">
      <!-- Three.js renders into its own canvas appended here -->
      <canvas id="minimap-canvas" width="160" height="120"
        style="position:absolute;bottom:10px;right:10px;z-index:10;border:2px solid #2a4a6a;cursor:pointer"></canvas>
      <div id="float-container"
        style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    </div>
  </div>

  <!-- Event modal -->
  <div id="event-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;align-items:center;justify-content:center;">
    <div style="background:#0d1520;border:1px solid #2a4a6a;border-radius:6px;padding:32px 36px;max-width:360px;width:90%;font-family:'Inter',sans-serif;">
      <div id="event-title" style="font-family:'Cinzel',serif;font-size:18px;margin-bottom:10px;"></div>
      <div id="event-body" style="font-size:13px;color:#7a9ab8;line-height:1.7;margin-bottom:22px;"></div>
      <div id="event-choices" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
  </div>

  <!-- Win / Game-over overlay -->
  <div id="game-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;align-items:center;justify-content:center;">
    <div style="background:#0d1117;border:2px solid #2a5a8a;border-radius:8px;padding:44px 48px;text-align:center;max-width:340px;font-family:'Inter',sans-serif;">
      <div id="overlay-title" style="font-family:'Cinzel',serif;font-size:26px;color:#c8a84a;margin-bottom:14px;"></div>
      <div id="overlay-body" style="font-size:14px;color:#a0b8d0;line-height:1.9;margin-bottom:28px;"></div>
      <button id="overlay-btn" style="padding:10px 32px;background:#1e3a5a;color:#d0e8f8;border:1px solid #2a6a9a;font-size:14px;border-radius:4px;cursor:pointer;font-family:inherit;letter-spacing:0.04em;"></button>
    </div>
  </div>

  <!-- Tech Tree Modal -->
  <div id="tech-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:300;align-items:center;justify-content:center;">
    <div style="background:#0a1018;border:1px solid #2a4a6a;border-radius:8px;padding:24px 28px;max-width:800px;width:96%;font-family:'Inter',sans-serif;max-height:88vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1a3050 transparent;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <div style="font-family:'Cinzel',serif;font-size:17px;color:#c8a84a;letter-spacing:1.5px;text-shadow:0 0 12px rgba(200,168,74,0.4)">🔬 Research</div>
        <button id="tech-close" style="background:rgba(255,255,255,0.04);border:1px solid #2a4a6a;color:#5a7a90;padding:4px 12px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12px;transition:all 0.12s">✕ Close</button>
      </div>
      <div id="tech-tree-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="game.js" onerror="document.body.innerHTML='<p style=color:red;padding:20px>Could not load game.js — make sure all 3 files are in the same folder</p>'"></script>
</body>
</html>
